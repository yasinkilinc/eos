name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash tools/check-clean.sh .
      # Same reason as ci.yml: the runtime is stdlib-only, the test suite is not.
      - name: install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-ui.txt
      - run: python -m pytest -q
      - name: Build the UI so the tarball needs no Node
        working-directory: ui/frontend
        run: npm ci && npm run build
      - name: Package
        # The archive is written outside the tree being archived and moved back
        # afterwards. Writing it into "." makes tar read its own growing output
        # and abort with "file changed as we read it".
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar --exclude='.git' --exclude='node_modules' --exclude='__pycache__' \
              --exclude='.pytest_cache' --exclude='.eos' \
              -czf "${RUNNER_TEMP}/eos-${VERSION}.tar.gz" .
          mv "${RUNNER_TEMP}/eos-${VERSION}.tar.gz" .
          echo "Archive contents (top level):"
          tar -tzf "eos-${VERSION}.tar.gz" | cut -d/ -f2 | sort -u | head -20
          echo "Prebuilt UI present:"
          tar -tzf "eos-${VERSION}.tar.gz" | grep -q 'ui/static/index.html' && echo yes || exit 1
      - uses: softprops/action-gh-release@v2
        with:
          files: eos-*.tar.gz
          generate_release_notes: true
