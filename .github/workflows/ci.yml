name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      # One platform failing must not hide whether the other passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-clean
        run: bash tools/check-clean.sh .
      # The core runtime needs nothing installed -- that is the point of it
      # being pure stdlib. The test suite is a different matter: it exercises
      # the UI layer too, so it needs pytest and httpx from requirements-dev
      # plus the UI's own runtime dependencies.
      - name: install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-ui.txt
      - name: pytest
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - name: frontend
        working-directory: ui/frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
